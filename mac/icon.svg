<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1b1a"/>
      <stop offset="0.55" stop-color="#0b0a0a"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="530" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b1a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff6b1a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6b1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#ffd0a6"/>
      <stop offset="0.18" stop-color="#ff9a4f"/>
      <stop offset="0.5" stop-color="#ff6b1a"/>
      <stop offset="0.82" stop-color="#c64400"/>
      <stop offset="1" stop-color="#7a2600"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.86" stop-color="#ff6b1a" stop-opacity="0"/>
      <stop offset="0.97" stop-color="#ffb071" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb071" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#sq)">
    <circle cx="512" cy="530" r="380" fill="url(#glow)"/>
    <!-- Schallwellen / Ringe -->
    <g fill="none" stroke="#ff6b1a" stroke-linecap="round">
      <circle cx="512" cy="530" r="262" stroke-width="9" stroke-opacity="0.5" stroke-dasharray="1180 466" transform="rotate(-128 512 530)"/>
      <circle cx="512" cy="530" r="326" stroke-width="6" stroke-opacity="0.24" stroke-dasharray="980 1068" transform="rotate(32 512 530)"/>
    </g>
    <!-- Kugel -->
    <circle cx="512" cy="530" r="182" fill="#ff6b1a" opacity="0.5" filter="url(#blur8)"/>
    <circle cx="512" cy="530" r="178" fill="url(#orb)"/>
    <circle cx="512" cy="530" r="178" fill="url(#rim)"/>
    <ellipse cx="462" cy="444" rx="92" ry="54" fill="url(#shine)" opacity="0.55" transform="rotate(-24 462 444)" filter="url(#blur3)"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>
