# Baut bei jeder Änderung die fertige Mac-App, prüft sie auf einem echten Mac
# und stellt sie danach als Download bereit:
# https://github.com/<konto>/<repo>/releases/latest/download/Assistent.dmg
#
# Die Macs bei GitHub sind oft knapp. Darum wird gleichzeitig auf einem Mac mit Apple-Chip und einem
# Intel-Mac gebaut (beide macOS 15 mit Xcode 26, also mit Apple Intelligence). Veröffentlicht wird die
# App von dem, der zuerst fertig ist – auf einem normalen Linux-Rechner.
name: Mac-App bauen

on:
  push:
    # versuch/…: bauen und prüfen, aber nicht veröffentlichen
    branches: [main, 'versuch/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Mit pipefail: Fehler vor „| tee“ lassen den Schritt scheitern
    shell: bash

jobs:
  bau:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      APP_VERSION: 0.3.${{ github.run_number }}
      APP_BUILD: ${{ github.run_number }}
      REQUIRE_APPLE_INTELLIGENCE: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26 wählen (für Apple Intelligence)
        run: |
          X="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          { xcodebuild -version; xcrun --sdk macosx --show-sdk-path; sw_vers; uname -m; } 2>&1 | tee -a protokoll.txt

      - name: Node.js für die App holen
        run: scripts/node-holen.sh 2>&1 | tee -a protokoll.txt

      - name: Sprach-Programm für Internet-Stimmen holen
        # Klappt das nicht, gibt es die App trotzdem – nur ohne Internet-Stimmen
        continue-on-error: true
        run: scripts/stimmen-programm-holen.sh 2>&1 | tee -a protokoll.txt

      - name: Tests
        run: build/node/node-$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64) --test test/*.test.js 2>&1 | tee -a protokoll.txt

      - name: App bauen
        run: scripts/mac-app-bauen.sh --paket 2>&1 | tee -a protokoll.txt

      - name: App starten und prüfen
        run: scripts/mac-app-pruefen.sh 2>&1 | tee -a protokoll.txt

      - name: Disk-Image bauen
        run: scripts/dmg-bauen.sh 2>&1 | tee -a protokoll.txt

      - uses: actions/upload-artifact@v4
        with:
          name: assistent-dmg-${{ matrix.os }}
          path: build/Assistent.dmg
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruefbericht-${{ matrix.os }}
          path: |
            protokoll.txt
            build/vorschau.png
          if-no-files-found: ignore
          retention-days: 7

  veroeffentlichen:
    needs: bau
    # auch wenn einer der beiden Macs nicht zu bekommen war
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_VERSION: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: assistent-dmg-*
          path: build
      - name: Als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="$(ls build/assistent-dmg-macos-15/Assistent.dmg build/assistent-dmg-macos-15-intel/Assistent.dmg 2>/dev/null | head -1 || true)"
          if [ -z "$DMG" ]; then echo "::error::Kein Mac hat die App fertig gebaut"; exit 1; fi
          echo "Veröffentliche $DMG"
          gh release create "v$APP_VERSION" "$DMG" \
            --target "$GITHUB_SHA" \
            --title "Assistent für den Mac – $APP_VERSION" \
            --notes-file mac/download-anleitung.md \
            --latest
