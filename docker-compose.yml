# Für später auf dem Server:  docker compose up -d
# Davor gehört ein Webserver mit HTTPS (z. B. Caddy), der auf 127.0.0.1:3000 weiterleitet.
services:
  assistent:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Europe/Berlin
      TRUST_PROXY: "1"
      # Deine Adresse eintragen:
      ALLOWED_HOSTS: assistent.example.de
      PUBLIC_URL: https://assistent.example.de
    volumes:
      - assistent-daten:/data

volumes:
  assistent-daten:
